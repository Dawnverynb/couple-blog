<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小游戏 · 我们的情侣空间</title>
<link rel="stylesheet" href="css/common.css">
<style>
  .game-hud {
    display: flex;
    justify-content: center;
    gap: 28px;
    font-size: 18px;
    color: var(--pink-text);
    margin-bottom: 14px;
  }
  .game-hud b { font-size: 26px; color: var(--pink-deep); }

  .play-area {
    position: relative;
    height: 56vh;
    min-height: 320px;
    border: 2px dashed var(--pink-deep);
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.55);
    overflow: hidden;
  }
  .play-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--pink-deep);
    font-size: 18px;
    opacity: 0.8;
  }
  .heart {
    position: absolute;
    cursor: pointer;
    user-select: none;
    line-height: 1;
    animation: heartIn 0.7s ease-out, heartFloat 2.6s ease-in-out infinite alternate;
    transition: transform 0.2s ease;
  }
  .heart:hover { transform: scale(1.15); }
  .heart.clicked { animation: heartOut 0.5s ease forwards; }
  .heart.leaving {
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  @keyframes heartIn {
    0% { transform: scale(0); opacity: 0; }
    60% { opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes heartFloat {
    from { margin-top: 0; }
    to   { margin-top: -10px; }
  }
  @keyframes heartOut {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .result-score { font-size: 22px; color: var(--pink-text); margin-bottom: 10px; }
  .result-score b { font-size: 34px; color: var(--pink-deep); }
  .result-msg { font-size: 17px; color: var(--pink-muted); line-height: 1.8; margin-bottom: 18px; }
</style>
</head>
<body>

<div id="decoLayer"></div>

<button class="menu-btn" id="menuBtn" aria-label="菜单" aria-expanded="false">☰</button>
<nav class="menu-panel" id="menuPanel" aria-label="功能菜单">
  <a href="index.html">首页</a>
  <a href="photos.html">照片墙</a>
  <a href="letters.html">情书</a>
  <a class="active" href="game.html">小游戏</a>
</nav>
  <div class="greeting-box" id="greetingBox"></div>

<div class="page">
  <h2 class="section-title">💗 爱心点击大作战</h2>
  <p class="section-sub">10 秒内点到越多越好，加油呀 💪</p>

  <div class="game-hud">
    <span>时间 <b id="timeLeft">10</b>s</span>
    <span>得分 <b id="score">0</b></span>
  </div>

  <div class="play-area" id="playArea">
    <div class="play-hint" id="playHint">点击「开始游戏」就出发 💕</div>
  </div>

  <div style="text-align:center;">
    <button class="btn" id="startBtn">开始游戏 💗</button>
  </div>

  <p class="footer">玩得开心～ 看谁点得更准更快 😘</p>
</div>

<!-- 结果弹窗 -->
<div class="modal-overlay" id="resultModal">
  <div class="modal">
    <h2>游戏结束 🎉</h2>
    <div class="result-score">你点了 <b id="finalScore">0</b> 下爱心！</div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="btn" id="againBtn">再玩一次 💞</button>
  </div>
</div>

<script src="js/deco.js"></script>
<script src="js/greeting.js"></script>
<script src="js/menu.js"></script>
<script src="js/welcome.js"></script>
<script src="js/game.js"></script>
</body>
</html>
