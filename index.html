<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的情侣空间</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>

<div id="decoLayer"></div>

<button class="menu-btn" id="menuBtn" aria-label="菜单" aria-expanded="false">☰</button>
<nav class="menu-panel" id="menuPanel" aria-label="功能菜单">
  <a class="active" href="index.html">首页</a>
  <a href="photos.html">照片墙</a>
  <a href="letters.html">情书</a>
  <a href="game.html">小游戏</a>
</nav>

<div class="page" style="text-align:center; padding-top:50px;">
  <div style="font-size:56px; animation:beat 1.2s ease-in-out infinite;">💗</div>
  <h1 class="section-title">我们的情侣空间</h1>
  <p class="section-sub">✨ 记录我们在一起的点点滴滴 ✨</p>

  <div style="background:rgba(255,255,255,.7); border:2px dashed var(--pink-deep); border-radius:24px; padding:28px 24px; max-width:520px; margin:0 auto; box-shadow:0 10px 30px rgba(255,155,179,.25);">
    <div style="font-size:22px; letter-spacing:6px; margin:8px 0;">⭐ 💕 ⭐ 💕 ⭐</div>
    <div style="font-size:18px; line-height:1.9;">
      我们已经相恋
      <div><span style="font-size:34px; font-weight:bold; color:var(--pink-deep);" id="days">0</span> 天</div>
      每一天都值得被收藏 🌸
    </div>
    <div style="font-size:22px; letter-spacing:6px; margin:8px 0;">🌟 💖 🌟 💖 🌟</div>
    <a class="btn" href="#" onclick="sayLove();return false;">点我一下 💞</a>
  </div>

  <!-- 纪念日倒计时模块 -->
  <section class="milestone">
    <h2 class="section-title" style="font-size:24px; margin-top:0;">💞 我们的纪念日</h2>
    <div class="days-big" id="daysBig">0</div>
    <div class="days-label">我们已经在一起这么久啦</div>
    <div class="countdown">距离下一个纪念日还有 <b id="nextDays">0</b> 天 🎉</div>
  </section>

  <p class="footer">Made with 💗 for us · GitHub Pages</p>
</div>

<script src="js/deco.js"></script>
<script src="js/greeting.js"></script>
<script src="js/menu.js"></script>
<script src="js/cursor-fx.js"></script>
<script>
  // 在一起纪念日（改成你们的真实日期即可）
  const startDay = new Date("2026-10-24");

  function daysBetween(a, b) {
    return Math.floor((b - a) / 86400000);
  }
  function nextAnniversary(from) {
    const m = startDay.getMonth(), d = startDay.getDate();
    let y = from.getFullYear();
    let cand = new Date(y, m, d);
    if (cand <= from) cand = new Date(y + 1, m, d);
    return cand;
  }
  function updateMilestone() {
    const now = new Date();
    document.getElementById("days").textContent = Math.max(daysBetween(startDay, now), 0);
    document.getElementById("daysBig").textContent = Math.max(daysBetween(startDay, now), 0);
    document.getElementById("nextDays").textContent = Math.max(daysBetween(now, nextAnniversary(now)), 0);
  }
  updateMilestone();
  setInterval(updateMilestone, 60000);

  function sayLove() {
    const words = ["我一直在", "你最可爱啦 🌷", "要记得按时吃饭哦", "歲歲平安", "今天也要开心哦 ☀️", "我们，岁岁年年", "我们一直在一起 💞"];
    const tip = document.createElement("div");
    tip.textContent = words[Math.floor(Math.random() * words.length)];
    // 在整个页面范围内随机位置出现
    const x = 8 + Math.random() * 76;
    const y = 12 + Math.random() * 70;
    tip.style.cssText =
      "position:fixed;left:" + x + "vw;top:" + y + "vh;transform:translate(-50%,-50%) scale(1);" +
      "font-size:28px;color:#ff7aa0;font-weight:bold;z-index:99;animation:pop .8s ease;pointer-events:none;";
    document.body.appendChild(tip);
    setTimeout(() => tip.remove(), 900);
  }
</script>
</body>
</html>
