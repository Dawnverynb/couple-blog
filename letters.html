<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情书 · 我们的情侣空间</title>
<link rel="stylesheet" href="css/common.css">
<style>
  .letter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .letter-card {
    background: rgba(255, 255, 255, 0.85);
    border: 2px solid #ffd0de;
    border-radius: 18px;
    padding: 18px 14px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(255, 155, 179, 0.2);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .letter-card:hover {
    transform: translateY(-4px) rotate(-1.5deg);
    box-shadow: 0 12px 24px rgba(255, 155, 179, 0.4);
    border-color: var(--pink-deep);
  }
  .letter-card .env { font-size: 34px; }
  .letter-card .lt-title {
    font-size: 14px;
    margin-top: 8px;
    color: var(--pink-text);
    line-height: 1.4;
  }
  .letter-card .lt-preview {
    font-size: 12px;
    color: var(--pink-deep);
    margin-top: 6px;
    opacity: 0.85;
  }

  /* 模态框 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(196, 88, 122, 0.4);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    max-width: 520px;
    width: 100%;
    max-height: 82vh;
    overflow: auto;
    border-radius: 24px;
    padding: 30px 28px;
    position: relative;
    box-shadow: 0 20px 50px rgba(196, 88, 122, 0.45);
  }
  .modal .close {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 26px;
    line-height: 1;
    border: none;
    background: none;
    color: var(--pink-deep);
    cursor: pointer;
  }
  .modal h2 {
    color: var(--pink-text);
    margin-bottom: 16px;
    font-size: 22px;
  }
  .modal .body {
    color: var(--pink-muted);
    line-height: 1.9;
    font-size: 16px;
    white-space: pre-line;
  }
</style>
</head>
<body>

<div id="decoLayer"></div>

<button class="menu-btn" id="menuBtn" aria-label="菜单" aria-expanded="false">☰</button>
<nav class="menu-panel" id="menuPanel" aria-label="功能菜单">
  <a href="index.html">首页</a>
  <a href="photos.html">照片墙</a>
  <a class="active" href="letters.html">情书</a>
  <a href="game.html">小游戏</a>
  <button class="theme-toggle" id="themeToggle" type="button">🌙 夜间</button>
</nav>

<div class="page">
  <h2 class="section-title">💌 100 封情书</h2>
  <p class="section-sub">点开每一封，听我说爱你 💞</p>

  <div class="letter-grid" id="letterGrid"></div>

  <p class="footer">替换 js/letters-data.js 里的 title / preview / content 即可换成你们的真实情书～</p>
</div>

<!-- 情书详情模态框 -->
<div class="modal-overlay" id="letterModal">
  <div class="modal">
    <button class="close" id="modalClose" aria-label="关闭">×</button>
    <h2 id="modalTitle"></h2>
    <div class="body" id="modalBody"></div>
  </div>
</div>

<script src="js/deco.js"></script>
<script src="js/menu.js"></script>
<script src="js/theme.js"></script>
<script src="js/cursor-fx.js"></script>
<script src="letters-data.js"></script>
<script src="js/letters.js"></script>
</body>
</html>
